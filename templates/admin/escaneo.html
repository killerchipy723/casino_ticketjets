<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Puerta - ANANA CLUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Librería ultraligera jsQR para procesar los frames del video -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { background-color: #08080c; color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-casino { background: #12121a; border: 1px solid #d4af37; border-radius: 16px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); width: 100%; max-width: 420px; padding: 25px; }
        .text-gold { color: #d4af37 !important; }
        .btn-gold { background: linear-gradient(45deg, #d4af37, #f9e076, #b38728); border: none; color: #000; font-weight: 900; text-transform: uppercase; padding: 12px; border-radius: 50px; }
        .btn-outline-gold { border: 1px solid #d4af37; color: #d4af37; font-weight: 700; text-transform: uppercase; padding: 10px; border-radius: 50px; background: transparent; }
        .btn-outline-gold:hover { background: #d4af37; color: #000; }
        .form-control { background-color: #08080c !important; color: #fff !important; border: 1px solid #d4af37 !important; border-radius: 8px; text-align: center; }
        #video-container { position: relative; width: 100%; height: 280px; background: #000; border: 2px solid #d4af37; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-laser { position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: #ff3333; box-shadow: 0 0 8px #ff3333; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 15%; } 50% { top: 85%; } 100% { top: 15%; } }
    </style>
</head>
<body>
    <!-- Navbar Superior Profesional y Responsiva -->
<nav class="navbar navbar-expand-lg navbar-dark bg-casino-dark border-bottom border-gold shadow-sm mb-4">
    <div class="container-fluid px-3">
        <!-- Logo / Marca -->
        <a class="navbar-brand d-flex align-items-center" href="/dashboard">
            <img src="{{ url_for('static', filename='images/anana_logo_transparente.png') }}" 
                 alt="ANANA CLUB" 
                 style="max-height: 38px; width: auto; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));" class="me-2">
            <span class="text-gold fw-bold tracking-wider" style="font-size: 0.95rem;">ANANA CLUB</span>
        </a>

        <!-- Botón Hamburguesa para Móviles -->
        <button class="navbar-toggler border-gold" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenido desplegable (Usuario y Acciones) -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-lg-center gap-2 mt-2 mt-lg-0">
                <!-- Info del Usuario Logueado -->
                <li class="nav-item d-flex align-items-center px-2 py-1 rounded bg-black bg-opacity-50 border border-secondary border-opacity-25">
                    <div class="me-2 text-start">
                        <div class="text-white fw-bold small text-truncate" style="max-width: 150px;">
                            {{ session.get('usuario_nombre', 'Usuario') }}
                        </div>
                        <div class="text-gold text-uppercase" style="font-size: 0.65rem; letter-spacing: 0.5px;">
                            Rol: {{ session.get('usuario_rol', 'Invitado') }}
                        </div>
                    </div>
                </li>

                <!-- Botón de Cerrar Sesión -->
                <li class="nav-item">
                    <a href="/logout" class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center gap-1 px-3 py-2" style="border-radius: 50px; font-weight: 700; font-size: 0.8rem;">
                        🚪 Salir
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<style>
    /* Estilos complementarios para mantener la línea visual del casino */
    .bg-casino-dark { background-color: #12121a !important; }
    .border-gold { border-color: #d4af37 !important; }
    .text-gold { color: #d4af37 !important; }
    
    /* Ajuste responsivo para el menú en móviles */
    @media (max-width: 991.98px) {
        .navbar-collapse {
            background-color: #0b0b10;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
    }
</style>

<div class="card-casino text-center">
    <!-- LOGO OFICIAL -->
    <div class="mb-2">
        <img src="{{ url_for('static', filename='images/anana_logo_transparente.png') }}" 
             alt="ANANA CLUB" 
             style="max-height: 50px; width: auto; object-fit: contain; filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));">
    </div>

    <h5 class="text-gold fw-bold mb-1">CONTROL DE PUERTA</h5>
    <p class="text-white small mb-3">Escanea el código QR del pase VIP</p>

    <!-- BOTÓN PARA INICIAR EL ESCANEO -->
    <div id="btn-iniciar-container" class="mb-3">
        <button type="button" class="btn btn-gold w-100" onclick="iniciarCamara()">📷 Iniciar Escaneo</button>
    </div>

    <!-- VÍDEO NATIVO DE LA CÁMARA TRASERA (Oculto al inicio) -->
    <div id="video-container">
        <video id="preview" playsinline></video>
        <div class="scan-laser"></div>
    </div>

    <!-- BOTÓN PARA DETENER / REINICIAR (Aparece solo cuando la cámara está activa) -->
    <div id="btn-detener-container" class="mb-3" style="display: none;">
        <button type="button" class="btn btn-outline-gold w-100 btn-sm" onclick="detenerCamara()">🔄 Detener / Escanear otro</button>
    </div>

    <div class="text-white small mb-2">— O ingreso manual —</div>

    <!-- ENTRADA MANUAL COMO RESPALDO -->
    <form onsubmit="validarCodigo(event)">
        <div class="mb-3">
            <input type="text" id="codigoInput" class="form-control" placeholder="ANANA-PASS-XXXXXXXX" required>
        </div>
        <button type="submit" class="btn btn-gold w-100">Verificar Código</button>
    </form>

    <div class="mt-3">
        <a href="/dashboard" class="text-white small text-decoration-none">← Volver al Panel</a>
    </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
    const video = document.getElementById('preview');
    const canvasElement = document.getElementById('canvas');
    const canvas = canvasElement.getContext('2d', { willReadFrequently: true });
    const videoContainer = document.getElementById('video-container');
    const btnIniciarContainer = document.getElementById('btn-iniciar-container');
    const btnDetenerContainer = document.getElementById('btn-detener-container');
    
    let scanning = false;
    let currentStream = null;

    function iniciarCamara() {
        btnIniciarContainer.style.display = 'none';
        videoContainer.style.display = 'block';
        btnDetenerContainer.style.display = 'block';
        scanning = true;

        // Forzar cámara trasera en dispositivos móviles (facingMode: environment)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(function(stream) {
            currentStream = stream;
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            requestAnimationFrame(tick);
        })
        .catch(function(err) {
            console.error("Error al acceder a la cámara: ", err);
            alert("No se pudo acceder a la cámara. Usa el ingreso manual.");
            detenerCamara();
        });
    }

    function detenerCamara() {
        scanning = false;
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
        video.srcObject = null;
        videoContainer.style.display = 'none';
        btnDetenerContainer.style.display = 'none';
        btnIniciarContainer.style.display = 'block';
    }

    function tick() {
        if (!scanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            
            var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            var code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code) {
                scanning = false;
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                
                let textoQR = code.data.trim();
                
                // Si escanea la URL completa, extraer el código final
                if (textoQR.includes('/')) {
                    const partes = textoQR.split('/');
                    textoQR = partes[partes.length - 1];
                }

                // Redirigir directamente a la validación sin límite de tiempo
                window.location.href = `/admin/validar/${textoQR}`;
                return;
            }
        }
        requestAnimationFrame(tick);
    }

    function validarCodigo(e) {
        e.preventDefault();
        const codigo = document.getElementById('codigoInput').value.trim();
        if (codigo) {
            window.location.href = `/admin/validar/${codigo}`;
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
