<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Puerta - ANANA CLUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Librería html5-qrcode para activar la cámara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #08080c; color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-casino { background: #12121a; border: 1px solid #d4af37; border-radius: 16px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); width: 100%; max-width: 450px; padding: 25px; }
        .text-gold { color: #d4af37 !important; }
        .btn-gold { background: linear-gradient(45deg, #d4af37, #f9e076, #b38728); border: none; color: #000; font-weight: 900; text-transform: uppercase; padding: 12px; border-radius: 50px; }
        .form-control { background-color: #08080c !important; color: #fff !important; border: 1px solid #d4af37 !important; border-radius: 8px; text-align: center; }
        #reader { border: 2px solid #d4af37; border-radius: 12px; overflow: hidden; background: #000; }
        #reader button { background: #d4af37 !important; color: #000 !important; border: none !important; padding: 6px 12px !important; border-radius: 6px !important; font-weight: bold !important; }
    </style>
</head>
<body>

<div class="card-casino text-center">
    <h3 class="text-gold fw-bold mb-1">📷 CONTROL DE PUERTA</h3>
    <p class="text-muted small mb-3">Escanea el código QR o ingresa el código abajo</p>

    <!-- Lector con Cámara -->
    <div id="reader" class="mb-3"></div>

    <div class="text-muted small mb-3">— O ingreso manual —</div>

    <!-- Entrada Manual como respaldo -->
    <form onsubmit="validarCodigo(event)">
        <div class="mb-3">
            <input type="text" id="codigoInput" class="form-control" placeholder="ANANA-PASS-XXXXXXXX" required>
        </div>
        <button type="submit" class="btn btn-gold w-100">Verificar Código</button>
    </form>

    <div class="mt-4">
        <a href="/dashboard" class="text-muted small text-decoration-none">← Volver al Panel</a>
    </div>
</div>

<script>
    function onScanSuccess(decodedText, decodedResult) {
        // Extraer el código del ticket si se escanea la URL completa
        let codigo = decodedText.trim();
        if (codigo.includes('/')) {
            const partes = codigo.split('/');
            codigo = partes[partes.length - 1];
        }
        
        // Detener cámara y redirigir a la validación
        html5QrcodeScanner.clear().then(_ => {
            window.location.href = `/admin/validar/${codigo}`;
        }).catch(error => {
            window.location.href = `/admin/validar/${codigo}`;
        });
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: { width: 220, height: 220 } }, false);
    html5QrcodeScanner.render(onScanSuccess);

    function validarCodigo(e) {
        e.preventDefault();
        const codigo = document.getElementById('codigoInput').value.trim();
        if (codigo) {
            window.location.href = `/admin/validar/${codigo}`;
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
