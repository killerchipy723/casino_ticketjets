<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR - ANANA CLUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Librería para lectura rápida de QR por cámara -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            background-color: #08080c;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            padding: 15px;
        }
        .card-casino {
            background: #12121a;
            border: 1px solid #d4af37;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
            padding: 15px;
            text-align: center;
        }
        .text-gold { color: #d4af37 !important; }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #d4af37;
            background: #000;
            min-height: 280px;
        }
    </style>
</head>
<body>

<div class="container py-2" style="max-width: 450px;">
    <!-- BARRA SUPERIOR -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-gold fw-bold mb-0">🍍 ANANA SCAN</h4>
        <a href="/admin" class="btn btn-outline-light btn-sm">Panel Admin</a>
    </div>

    <!-- CONTENEDOR DEL VISOR DE CÁMARA -->
    <div class="card-casino mb-3">
        <h6 class="text-gold mb-2">Escaneando Ticket VIP</h6>
        <div id="reader"></div>
        <p class="text-muted small mt-2 mb-0" id="status-msg">Iniciando cámara trasera...</p>
    </div>

    <!-- INGRESO MANUAL SI FALLA O NO TIENE CÁMARA -->
    <div class="card-casino">
        <p class="text-light small mb-2">Ingreso manual de código:</p>
        <form onsubmit="validarManual(event)" class="d-flex gap-2">
            <input type="text" id="codigoManual" class="form-control bg-dark text-white border-secondary text-uppercase" placeholder="Ej: ANANA-A1B2C3D4" required>
            <button type="submit" class="btn btn-warning fw-bold">Validar</button>
        </form>
    </div>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    // Configuración para forzar la cámara trasera directamente
    const qrConfig = { fps: 15, qrbox: { width: 220, height: 220 } };

    // Iniciar cámara automáticamente al cargar
    window.addEventListener("DOMContentLoaded", () => {
        html5QrCode.start(
            { facingMode: "environment" }, // "environment" fuerza la cámara trasera del celular
            qrConfig,
            (decodedText) => {
                // Al detectar el QR de forma exitosa:
                html5QrCode.stop().then(() => {
                    if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
                        window.location.href = decodedText;
                    } else {
                        window.location.href = "/admin/validar/" + decodedText;
                    }
                });
            },
            (errorMessage) => {
                // Errores de lectura continua (se ignoran)
            }
        ).catch(err => {
            document.getElementById("status-msg").innerHTML = 
                "<span class='text-danger'>⚠️ Da permisos de cámara en el navegador o usá el ingreso manual.</span>";
        });
    });

    function validarManual(e) {
        e.preventDefault();
        const codigo = document.getElementById('codigoManual').value.trim();
        if (codigo) {
            window.location.href = "/admin/validar/" + codigo;
        }
    }
</script>

</body>
</html>
