<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ANANA CLUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="login-card text-center">
    <!-- LOGO OFICIAL ANANA CLUB -->
    <div class="mb-3">
        <img src="{{ url_for('static', filename='images/anana_logo_transparente.png') }}" 
             alt="ANANA CLUB Logo" 
             class="img-fluid" 
        style="max-height: 110px; width: auto; object-fit: contain; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));"
    </div>
    
    <p class="text-light small mb-4" style="font-size: 0.8rem; letter-spacing: 2px;">ACCESO AL SISTEMA</p>

    <!-- Alertas de error si las credenciales fallan -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-danger py-2 small mb-3" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/">
        <div class="mb-3 text-start">
            <label class="form-label small text-light">Usuario</label>
            <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label small text-light">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-gold w-100">Ingresar</button>
    </form>
    
    <div class="mt-4">
  
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
