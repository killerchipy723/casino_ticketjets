<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANANA CLUB - Noche de Casino</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <!-- Estilos Personalizados Mobile-First -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.min.css') }}">
</head>
<body>

<div class="main-container text-center py-3">

    <!-- LOGO OFICIAL PNG TRANSPARENTE -->
    <div class="logo-container text-center py-2">
        <div class="anana-logo-wrapper mb-2">
            <img src="{{ url_for('static', filename='images/anana_logo_transparente.png') }}" 
                 alt="ANANA CLUB Logo" 
                 class="img-fluid" 
                 style="max-height: 130px; width: auto; object-fit: contain; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));">
        </div>
        <div class="sub-title text-gold fw-bold" style="letter-spacing: 2px;">NOCHE DE CASINO</div>
        <p class="slogan-phrase text-light small mb-0">Tu noche de suerte está llegando</p>
    </div>

    <!-- ESCENARIO RULETA AMPLIADO Y PROFESIONAL -->
    <div id="juego-section" class="w-100 my-2">
        <div class="casino-stage">
            <!-- Puntero indicador superior -->
            <div class="puntero-ruleta"></div>
            <!-- Contenedor del Canvas en resolución HD (500x500) -->
            <div class="ruleta-container">
                <canvas id="canvasRuleta" width="500" height="500"></canvas>
            </div>
        </div>
        <div class="mt-3 px-3">
            <button id="btnGirar" class="btn btn-gold-spin w-100 py-3" onclick="iniciarGiro()">🎲 ¡GIRAR RULETA VIP!</button>
        </div>
    </div>

    <!-- SECCIÓN RECLAMO DE PREMIO (COMPACTA) -->
    <div id="premio-section" class="d-none card card-casino p-3 w-100 mx-auto" style="max-width: 380px;">
        <h4 class="text-warning fw-bold mb-1">🎉 ¡FELICIDADES! 🎉</h4>
        <p class="text-white small mb-1">GANASTE!!!</p>
        <h5 id="textoPremioGanado" class="text-white fw-bold mb-2" style="text-shadow: 0 0 8px #d4af37;"></h5>
        
        <hr class="border-secondary my-2">

        <p class="small text-white mb-2" style="font-size: 0.85rem;">Completá tus datos para generar tu ticket:</p>
        
        <div class="mb-2 text-start">
            <label class="form-label small text-white fw-bold mb-1">Tu Nombre</label>
            <input type="text" id="nombre" class="form-control form-control-sm bg-dark text-white border-gold input-custom" placeholder="Ej: Lucas Gómez">
        </div>
        <div class="mb-3 text-start">
            <label class="form-label small text-white fw-bold mb-1">Tu Teléfono (WhatsApp)</label>
            <input type="tel" id="telefono" class="form-control form-control-sm bg-dark text-white border-gold input-custom" placeholder="Ej: 3874123456">
        </div>
        
        <button class="btn btn-gold w-100 py-2 fw-bold" onclick="reclamarPremio()">Reclamar y Generar Ticket</button>
    </div>

</div>

<!-- Contenedor oculto con los datos serializados para evitar errores de linter en VS Code -->
<div id="datos-juego" data-premios='{{ premios | tojson | safe }}' style="display: none;"></div>

<!-- Lectura segura de los datos -->
<script>
    const datosElemento = document.getElementById('datos-juego');
    const premiosOriginales = JSON.parse(datosElemento.getAttribute('data-premios'));
</script>

<!-- Archivo JavaScript externo de la Ruleta -->
<script src="{{ url_for('static', filename='js/ruleta.js') }}"></script>

</body>
</html>
