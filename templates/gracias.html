<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premio Registrado - ANANA CLUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #08080c; 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 15px; 
        }
        .card-casino { 
            background: #12121a; 
            border: 1px solid #d4af37; 
            border-radius: 16px; 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); 
            max-width: 400px; 
            width: 100%; 
            text-align: center; 
            padding: 25px; 
        }
        .text-gold { color: #d4af37 !important; }
        .btn-gold { 
            background: linear-gradient(45deg, #d4af37, #f9e076, #b38728); 
            color: #000; 
            font-weight: 900; 
            border: none; 
            border-radius: 50px; 
            padding: 12px; 
            margin-bottom: 10px; 
            width: 100%; 
            text-transform: uppercase; 
        }
        .btn-whatsapp { 
            background: #25d366; 
            color: #fff; 
            font-weight: bold; 
            border-radius: 50px; 
            padding: 12px; 
            width: 100%; 
            text-transform: uppercase; 
        }
    </style>
</head>
<body>

<div class="card-casino p-4 text-center">

    <!-- LOGO OFICIAL PNG TRANSPARENTE DE ANANA CLUB -->
    <div class="logo-container text-center mb-3">
        <div class="anana-logo-wrapper mb-1">
            <img src="{{ url_for('static', filename='images/anana_logo_transparente.png') }}" 
                 alt="ANANA CLUB Logo" 
                 class="img-fluid" 
                 style="max-height: 110px; width: auto; object-fit: contain; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));">
        </div>
        <div class="sub-title text-gold fw-bold small" style="letter-spacing: 2px;">NOCHE DE CASINO</div>
    </div>

    <h5 class="text-white mb-3">¡Felicidades, {{ datos.nombre }}!</h5>
    
    <!-- SECCIÓN ORGANIZADA DE GANASTE Y DETALLE -->
    <div class="mb-3">
        <p class="text-gold small mb-1 fw-bold text-uppercase" style="letter-spacing: 1.5px; text-shadow: 0 0 5px rgba(212, 175, 55, 0.4);">
            ¡GANASTE!
        </p>
        <h4 class="text-gold fw-bold mb-0" style="text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);">
            {{ datos.premio }}
        </h4>
    </div>
    
    <div class="p-3 mb-3" style="background: rgba(212,175,55,0.1); border-radius: 10px; border: 1px dashed #d4af37;">
        <p class="text-light small mb-1">Tu Código de Ticket VIP:</p>
        <h4 class="text-gold fw-bold mb-0"><code>{{ datos.codigo_ticket }}</code></h4>
    </div>

    <!-- BOTÓN DE DESCARGA MANUAL DE TICKET PDF -->
    <a id="btnDescargar" href="/descargar_ticket/{{ datos.codigo_ticket }}" class="btn btn-gold w-100 mb-2 py-2">
        📥 Descargar Ticket Premiado (PDF)
    </a>

    <!-- BOTÓN WHATSAPP -->
    <a href="{{ link_whatsapp }}" target="_blank" class="btn btn-whatsapp text-decoration-none w-100 mb-2 py-2">
        📱 Contactar por WhatsApp
    </a>

    <div class="mt-3">
        <a href="/" class="text-white small text-decoration-none">← Volver al inicio</a>
    </div>
</div>

<script>
    // Dispara la descarga automática del ticket PDF 1 segundo después de cargar la página
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const linkDescarga = document.getElementById('btnDescargar');
            if (linkDescarga) {
                window.location.href = linkDescarga.href;
            }
        }, 1000);
    });
</script>

</body>
</html>
